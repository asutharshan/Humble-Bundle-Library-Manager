<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Humble Library Manager</title><link rel="stylesheet" href="/static/style.css"></head><body><main>
<header><div><h1>Humble Library Manager</h1><p>Local purchase browser & full-file backup</p></div><span id="conn">Not connected</span></header>
<section><h2>Authentication</h2><div class="row"><input id="cookie" type="password" placeholder="Paste _simpleauth_sess cookie"><button onclick="validate()">Validate & Load</button></div><small>Held in application memory only. It is not saved to disk.</small></section>
<section id="lib" class="hide"><div class="toolbar"><b id="stats"></b><div class="row"><input id="search" placeholder="Search purchases…" oninput="page=1;render()"><select id="size" onchange="page=1;render()"><option>20</option><option>50</option><option selected>100</option></select></div></div><div class="selectbar"><label><input type="checkbox" onchange="allMatch(this.checked)"> Select all matching</label><label><input type="checkbox" onchange="allPage(this.checked)"> Select this page</label></div><div id="orders"></div><div class="pager"><button onclick="prev()">‹ Previous</button><span id="pages"></span><button onclick="next()">Next ›</button></div></section>
<section id="dl" class="hide"><h2>Download selected purchases/files</h2><div class="row"><input id="dest" value="./HumbleLibrary" placeholder="D:\HumbleLibrary"><button onclick="catalogue()">Export Catalogue</button><button class="green" onclick="start()">Download Selected</button></div><div id="prog" class="hide"><div class="meter"><i id="bar"></i></div><div class="between"><b id="pct">0%</b><span id="counts"></span></div><p id="current"></p><button class="danger" onclick="cancel()">Cancel</button><div id="logs"></div></div></section>
</main><script src="/static/app.js"></script></body></html>
